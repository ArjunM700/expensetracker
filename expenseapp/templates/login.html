{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker | Sign In</title>

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            primary: '#2563eb',       /* Corporate Blue */
                            primaryHover: '#1d4ed8',
                            accent: '#38bdf8',
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-slate-100 text-slate-900 font-sans min-h-screen flex flex-col justify-center items-center p-4 sm:p-6 selection:bg-brand-primary selection:text-white">

    <!-- Top Action / Back Button -->
    <div class="w-full max-w-[420px] mb-6 flex items-center justify-start">
        <a href="{% url 'index' %}" 
           class="inline-flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-semibold text-slate-600 bg-white hover:bg-slate-50 border border-slate-300 transition-all duration-200 group shadow-sm hover:shadow">
            <i class="fas fa-arrow-left text-xs text-brand-primary group-hover:-translate-x-1 transition-transform"></i>
            <span>Back to Home</span>
        </a>
    </div>

    <!-- Central Login Card (Off-white, clear border, visible shadow) -->
    <main class="w-full max-w-[420px] bg-slate-50 rounded-3xl shadow-xl shadow-slate-300/50 border border-slate-300 p-6 sm:p-8 lg:p-10 relative z-10">
        
        <!-- Logo Branding -->
        <div class="flex flex-col items-center justify-center gap-3 mb-8 text-center">
            <div class="w-12 h-12 rounded-2xl bg-blue-50 flex items-center justify-center text-brand-primary border border-blue-200 shadow-sm">
                <i class="fas fa-wallet text-xl"></i>
            </div>
            <div>
                <h1 class="text-2xl font-extrabold tracking-tight text-slate-900">
                    Welcome Back
                </h1>
                <p class="text-sm text-slate-500 mt-1">Sign in to access your dashboard</p>
            </div>
        </div>

        <!-- Django Messages Component -->
        {% if messages %}
            <div class="mb-6 space-y-2">
                {% for message in messages %}
                    <div class="px-4 py-3 rounded-xl text-xs sm:text-sm font-semibold flex items-center gap-2.5 
                        {% if message.tags == 'success' %}
                            bg-green-50 border border-green-200 text-green-700
                        {% else %}
                            bg-red-50 border border-red-200 text-red-700
                        {% endif %}">
                        <i class="fas {% if message.tags == 'success' %}fa-circle-check{% else %}fa-circle-exclamation{% endif %} text-base shrink-0"></i>
                        <span>{{ message }}</span>
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <!-- Login Form -->
        <form method="POST" action="{% url 'login' %}" class="space-y-5" novalidate>
            {% csrf_token %}

            <!-- Username Field -->
            <div>
                <label for="username" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">
                    Username
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
                        <i class="fas fa-user text-sm"></i>
                    </span>
                    <input type="text" 
                           id="username" 
                           name="username" 
                           required 
                           autocomplete="username"
                           class="w-full pl-10 pr-4 py-3 rounded-xl text-sm text-slate-900 bg-white border border-slate-300 placeholder-slate-400 focus:outline-none focus:border-brand-primary focus:ring-1 focus:ring-brand-primary transition-all">
                </div>
            </div>

            <!-- Password Field -->
            <div>
                <label for="password" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">
                    Password
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
                        <i class="fas fa-lock text-sm"></i>
                    </span>
                    <input type="password" 
                           id="password" 
                           name="password" 
                           required 
                           autocomplete="current-password"
                           class="w-full pl-10 pr-11 py-3 rounded-xl text-sm text-slate-900 bg-white border border-slate-300 placeholder-slate-400 focus:outline-none focus:border-brand-primary focus:ring-1 focus:ring-brand-primary transition-all">
                    
                    <button type="button" 
                            id="toggle-password" 
                            aria-label="Toggle password visibility"
                            class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400 hover:text-brand-primary focus:outline-none transition-colors">
                        <i class="fas fa-eye text-sm" id="toggle-icon"></i>
                    </button>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" 
                    class="w-full py-3.5 px-4 mt-2 rounded-xl font-bold text-sm bg-brand-primary text-white hover:bg-brand-primaryHover transition-all duration-200 shadow-md hover:shadow-lg flex items-center justify-center gap-2">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>

        <!-- Divider -->
        <div class="relative my-8">
            <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-slate-300"></div>
            </div>
            <div class="relative flex justify-center text-xs uppercase">
                <span class="bg-slate-50 px-3 text-slate-500 font-bold tracking-wider">
                    New here?
                </span>
            </div>
        </div>

        <!-- Register CTA -->
        <div class="text-center">
            <p class="text-sm text-slate-600 font-medium">
                Don't have an account yet? 
                <a href="{% url 'register' %}" class="font-bold text-brand-primary hover:text-brand-primaryHover hover:underline transition-colors ml-1">
                    Create an account <i class="fas fa-arrow-right text-xs ml-1"></i>
                </a>
            </p>
        </div>
    </main>

    <!-- Simple Footer -->
    <footer class="mt-8 text-center text-xs text-slate-500 font-medium z-10">
        <p>&copy; <span id="current-year"></span> Expense Tracker.</p>
    </footer>

    <script>
        // Set dynamic year in footer
        document.getElementById('current-year').textContent = new Date().getFullYear();

        // Password visibility toggle
        const passwordInput = document.getElementById('password');
        const toggleButton = document.getElementById('toggle-password');
        const toggleIcon = document.getElementById('toggle-icon');

        if (toggleButton && passwordInput) {
            toggleButton.addEventListener('click', () => {
                const isPassword = passwordInput.getAttribute('type') === 'password';
                passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
                
                if (isPassword) {
                    toggleIcon.classList.replace('fa-eye', 'fa-eye-slash');
                    toggleButton.setAttribute('aria-label', 'Hide password');
                } else {
                    toggleIcon.classList.replace('fa-eye-slash', 'fa-eye');
                    toggleButton.setAttribute('aria-label', 'Show password');
                }
            });
        }
    </script>
</body>
</html>
