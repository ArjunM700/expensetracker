{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker | Create Account</title>

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            primary: '#2563eb',       /* Corporate Blue */
                            primaryHover: '#1d4ed8',
                            accent: '#38bdf8',
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes slideInDown {
            from { opacity: 0; transform: translateY(-16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeOutUp {
            from { opacity: 1; transform: translateY(0); }
            to   { opacity: 0; transform: translateY(-16px); }
        }
        .popup-msg {
            animation: slideInDown 0.4s ease-out forwards;
        }
    </style>
</head>

<body class="bg-slate-100 text-slate-900 font-sans min-h-screen flex flex-col justify-center items-center p-4 sm:p-6 selection:bg-brand-primary selection:text-white">

    <!-- Top Action / Back Button -->
    <div class="w-full max-w-[480px] mb-6 flex items-center justify-start">
        <a href="{% url 'index' %}" 
           class="inline-flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-semibold text-slate-600 bg-white hover:bg-slate-50 border border-slate-300 transition-all duration-200 group shadow-sm hover:shadow">
            <i class="fas fa-arrow-left text-xs text-brand-primary group-hover:-translate-x-1 transition-transform"></i>
            <span>Back to Home</span>
        </a>
    </div>

    <!-- Central Register Card (Off-white, clear border, visible shadow) -->
    <main class="w-full max-w-[480px] bg-slate-50 rounded-3xl shadow-xl shadow-slate-300/50 border border-slate-300 p-6 sm:p-8 lg:p-10 relative z-10">
        
        <!-- Logo Branding -->
        <div class="flex flex-col items-center justify-center gap-3 mb-8 text-center">
            <div class="w-12 h-12 rounded-2xl bg-blue-50 flex items-center justify-center text-brand-primary border border-blue-200 shadow-sm">
                <i class="fas fa-user-plus text-xl"></i>
            </div>
            <div>
                <h1 class="text-2xl font-extrabold tracking-tight text-slate-900">
                    Create Account
                </h1>
                <p class="text-sm text-slate-500 mt-1">Get started in less than a minute</p>
            </div>
        </div>

        <!-- Django Messages Component -->
        {% if messages %}
            <div class="mb-6 space-y-2">
                {% for message in messages %}
                    <div class="popup-msg px-4 py-3 rounded-xl text-xs sm:text-sm font-semibold flex items-center gap-2.5 
                        {% if message.tags == 'success' %}
                            bg-green-50 border border-green-200 text-green-700
                        {% else %}
                            bg-red-50 border border-red-200 text-red-700
                        {% endif %}">
                        <i class="fas {% if message.tags == 'success' %}fa-circle-check{% else %}fa-circle-exclamation{% endif %} text-base shrink-0"></i>
                        <span class="flex-1">{{ message }}</span>
                        <button type="button" onclick="this.parentElement.style.animation='fadeOutUp 0.3s ease-in forwards';setTimeout(()=>this.parentElement.remove(),300)" class="ml-auto text-current opacity-50 hover:opacity-100 transition-opacity" aria-label="Dismiss">
                            <i class="fas fa-xmark text-sm"></i>
                        </button>
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <!-- Register Form -->
        <form method="POST" action="" class="space-y-5" novalidate>
            {% csrf_token %}

            <!-- Username Field -->
            <div>
                <label for="username" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">
                    Username
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
                        <i class="fas fa-at text-sm"></i>
                    </span>
                    <input type="text" 
                           id="username" 
                           name="username" 
                           required 
                           autocomplete="username"
                           class="w-full pl-10 pr-4 py-3 rounded-xl text-sm text-slate-900 bg-white border border-slate-300 focus:outline-none focus:border-brand-primary focus:ring-1 focus:ring-brand-primary transition-all">
                </div>
            </div>

            <!-- First and Last Name Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                <div>
                    <label for="first_name" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">
                        First Name
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
                            <i class="fas fa-user text-sm"></i>
                        </span>
                        <input type="text" 
                               id="first_name" 
                               name="first_name" 
                               required 
                               class="w-full pl-10 pr-4 py-3 rounded-xl text-sm text-slate-900 bg-white border border-slate-300 focus:outline-none focus:border-brand-primary focus:ring-1 focus:ring-brand-primary transition-all">
                    </div>
                </div>

                <div>
                    <label for="last_name" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">
                        Last Name
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
                            <i class="fas fa-user text-sm"></i>
                        </span>
                        <input type="text" 
                               id="last_name" 
                               name="last_name" 
                               required 
                               class="w-full pl-10 pr-4 py-3 rounded-xl text-sm text-slate-900 bg-white border border-slate-300 focus:outline-none focus:border-brand-primary focus:ring-1 focus:ring-brand-primary transition-all">
                    </div>
                </div>
            </div>

            <!-- Email Field -->
            <div>
                <label for="email" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">
                    Email Address
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
                        <i class="fas fa-envelope text-sm"></i>
                    </span>
                    <input type="email" 
                           id="email" 
                           name="email" 
                           required 
                           autocomplete="email"
                           class="w-full pl-10 pr-4 py-3 rounded-xl text-sm text-slate-900 bg-white border border-slate-300 focus:outline-none focus:border-brand-primary focus:ring-1 focus:ring-brand-primary transition-all">
                </div>
            </div>

            <!-- Password Field -->
            <div>
                <label for="password" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">
                    Password
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
                        <i class="fas fa-lock text-sm"></i>
                    </span>
                    <input type="password" 
                           id="password" 
                           name="password" 
                           required 
                           autocomplete="new-password"
                           class="w-full pl-10 pr-11 py-3 rounded-xl text-sm text-slate-900 bg-white border border-slate-300 focus:outline-none focus:border-brand-primary focus:ring-1 focus:ring-brand-primary transition-all">
                    
                    <button type="button" 
                            id="toggle-password" 
                            aria-label="Toggle password visibility"
                            class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400 hover:text-brand-primary focus:outline-none transition-colors">
                        <i class="fas fa-eye text-sm" id="toggle-icon"></i>
                    </button>
                </div>
                
                <!-- Dynamic Password Strength Meter -->
                <div class="mt-3 flex items-center gap-3">
                    <div class="flex-1 grid grid-cols-4 gap-1 h-1.5">
                        <span class="bg-slate-200 rounded-full transition-colors duration-300" id="bar1"></span>
                        <span class="bg-slate-200 rounded-full transition-colors duration-300" id="bar2"></span>
                        <span class="bg-slate-200 rounded-full transition-colors duration-300" id="bar3"></span>
                        <span class="bg-slate-200 rounded-full transition-colors duration-300" id="bar4"></span>
                    </div>
                    <span class="text-[10px] text-slate-500 font-bold uppercase tracking-wider min-w-[55px] text-right" id="pwdLabel">Security</span>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" 
                    class="w-full py-3.5 px-4 mt-4 rounded-xl font-bold text-sm bg-brand-primary text-white hover:bg-brand-primaryHover transition-all duration-200 shadow-md hover:shadow-lg flex items-center justify-center gap-2">
                <span>Complete Registration</span>
                <i class="fas fa-arrow-right text-xs"></i>
            </button>
        </form>

        <!-- Divider -->
        <div class="relative my-8">
            <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-slate-300"></div>
            </div>
            <div class="relative flex justify-center text-xs uppercase">
                <span class="bg-slate-50 px-3 text-slate-500 font-bold tracking-wider">
                    Already registered?
                </span>
            </div>
        </div>

        <!-- Login CTA -->
        <div class="text-center">
            <p class="text-sm text-slate-600 font-medium">
                Have an account? 
                <a href="{% url 'login' %}" class="font-bold text-brand-primary hover:text-brand-primaryHover hover:underline transition-colors ml-1">
                    Log in here
                </a>
            </p>
        </div>
    </main>

    <!-- Simple Footer -->
    <footer class="mt-8 text-center text-xs text-slate-500 font-medium z-10">
        <p>&copy; <span id="current-year"></span> Expense Tracker.</p>
    </footer>

    <script>
        // Set dynamic year in footer
        document.getElementById('current-year').textContent = new Date().getFullYear();

        // Password visibility toggle
        const passwordInput = document.getElementById('password');
        const toggleButton = document.getElementById('toggle-password');
        const toggleIcon = document.getElementById('toggle-icon');

        if (toggleButton && passwordInput) {
            toggleButton.addEventListener('click', () => {
                const isPassword = passwordInput.getAttribute('type') === 'password';
                passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
                
                if (isPassword) {
                    toggleIcon.classList.replace('fa-eye', 'fa-eye-slash');
                    toggleButton.setAttribute('aria-label', 'Hide password');
                } else {
                    toggleIcon.classList.replace('fa-eye-slash', 'fa-eye');
                    toggleButton.setAttribute('aria-label', 'Show password');
                }
            });
        }

        // Interactive dynamic password strength meter
        const bars = [
            document.getElementById('bar1'),
            document.getElementById('bar2'),
            document.getElementById('bar3'),
            document.getElementById('bar4')
        ];
        const pwdLabel = document.getElementById('pwdLabel');

        passwordInput.addEventListener('input', function () {
            const val = passwordInput.value;
            let score = 0;

            if (val.length >= 6) score++;
            if (val.length >= 10) score++;
            if (/[0-9]/.test(val) && /[a-zA-Z]/.test(val)) score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;

            // Tailwind equivalent hex codes for colors
            const colors = ['#ef4444', '#f59e0b', '#3b82f6', '#10b981']; 
            const labels = ['Weak', 'Fair', 'Good', 'Strong'];

            bars.forEach((b, index) => {
                if (index < score) {
                    b.style.backgroundColor = colors[score - 1];
                } else {
                    b.style.backgroundColor = '#e2e8f0'; // slate-200
                }
            });

            if (val.length === 0) {
                pwdLabel.textContent = 'Security';
                pwdLabel.style.color = '#64748b'; // slate-500
            } else {
                pwdLabel.textContent = labels[score - 1] || 'Weak';
                pwdLabel.style.color = colors[score - 1] || '#ef4444';
            }
        });

        // Auto-dismiss popup messages after 5 seconds
        document.querySelectorAll('.popup-msg').forEach(function(msg) {
            setTimeout(function() {
                msg.style.animation = 'fadeOutUp 0.4s ease-in forwards';
                setTimeout(function() { msg.remove(); }, 400);
            }, 5000);
        });
    </script>
</body>
</html>
