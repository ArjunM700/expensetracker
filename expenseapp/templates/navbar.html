<!-- Left Sidebar Navigation Component -->
<style>
    :root {
        /* Corporate Light Theme Variables */
        --sidebar-bg: #ffffff;
        --sidebar-border: #e2e8f0;
        
        --brand-primary: #2563eb;       /* Professional Blue */
        --brand-primary-hover: #1d4ed8;
        --brand-accent: #eff6ff;        /* Light blue for highlights */
        
        --sidebar-text: #0f172a;        /* Dark slate */
        --sidebar-muted: #64748b;       /* Lighter slate */
        --sidebar-hover: #f8fafc;
        
        --sidebar-width: 260px;
        --transition: all 0.2s ease;
    }

    /* Fixed Left Sidebar */
    .app-sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: var(--sidebar-width);
        background-color: var(--sidebar-bg);
        border-right: 1px solid var(--sidebar-border);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 24px 18px;
        z-index: 1000;
        box-sizing: border-box;
    }

    /* Brand Logo */
    .sidebar-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
        color: var(--sidebar-text);
        font-size: 1.15rem;
        font-weight: 700;
        letter-spacing: -0.4px;
        padding: 6px 10px 22px;
        border-bottom: 1px solid var(--sidebar-border);
        font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .sidebar-brand-icon {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        background: var(--brand-primary);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        flex-shrink: 0;
    }

    .sidebar-brand span {
        color: var(--brand-primary);
    }

    /* Navigation Sections */
    .sidebar-body {
        flex: 1;
        overflow-y: auto;
        padding-top: 20px;
        display: flex;
        flex-direction: column;
        gap: 24px;
    }

    .sidebar-group-title {
        font-size: 0.75rem;
        text-transform: uppercase;
        font-weight: 600;
        letter-spacing: 0.5px;
        color: var(--sidebar-muted);
        padding: 0 12px;
        margin-bottom: 10px;
    }

    .sidebar-menu {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .sidebar-link {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 14px;
        border-radius: 6px;
        text-decoration: none;
        font-size: 0.875rem;
        font-weight: 500;
        color: var(--sidebar-muted);
        transition: var(--transition);
    }

    .sidebar-link svg {
        flex-shrink: 0;
        stroke: currentColor;
    }

    .sidebar-link:hover {
        color: var(--brand-primary);
        background: var(--sidebar-hover);
        transform: translateX(3px);
    }

    /* Highlighted Action Buttons */
    .sidebar-btn-primary {
        background: var(--brand-primary);
        color: #ffffff !important;
        font-weight: 600;
        margin-bottom: 6px;
    }

    .sidebar-btn-primary svg {
        stroke: #ffffff !important;
    }

    .sidebar-btn-primary:hover {
        background: var(--brand-primary-hover) !important;
        transform: translateY(-2px);
    }

    .sidebar-btn-accent {
        background: #f8fafc;
        color: var(--sidebar-text) !important;
        border: 1px solid var(--sidebar-border);
        margin-bottom: 6px;
    }

    .sidebar-btn-accent:hover {
        background: #f1f5f9;
        color: var(--brand-primary) !important;
        border-color: #cbd5e1;
    }

    /* Bottom User & Logout Controls */
    .sidebar-footer {
        padding-top: 18px;
        border-top: 1px solid var(--sidebar-border);
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .sidebar-logout {
        color: #dc2626 !important; /* Corporate Red */
    }

    .sidebar-logout:hover {
        background: #fef2f2 !important;
        color: #b91c1c !important;
    }

    /* Custom inline tags for Reports/Logs */
    .nav-tag {
        font-size: 0.65rem;
        font-weight: 600;
        text-transform: uppercase;
        padding: 3px 8px;
        border-radius: 4px;
        background: #eff6ff;
        color: var(--brand-primary);
        border: 1px solid #bfdbfe;
    }

    /* Mobile Responsive Header Toggle */
    .mobile-header-bar {
        display: none;
    }

    @media (max-width: 820px) {
        .app-sidebar {
            transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.1);
        }

        .app-sidebar.sidebar-open {
            transform: translateX(0);
        }

        .sidebar-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.4); /* Darker backdrop for light theme */
            backdrop-filter: blur(2px);
            z-index: 999;
        }

        .sidebar-backdrop.active {
            display: block;
        }

        .mobile-header-bar {
            position: sticky;
            top: 0;
            z-index: 990;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--sidebar-bg);
            border-bottom: 1px solid var(--sidebar-border);
            padding: 12px 18px;
        }

        .mobile-brand {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--sidebar-text);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        
        .mobile-brand svg {
            color: var(--brand-primary);
        }

        .mobile-menu-btn {
            background: #f8fafc;
            border: 1px solid var(--sidebar-border);
            color: var(--sidebar-text);
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    }
</style>

<!-- Mobile Top Header (Visible on smaller screens) -->

</header>

<script>
    function toggleSidebar() {
        const sidebar = document.getElementById('appSidebar');
        const backdrop = document.getElementById('sidebarBackdrop');
        sidebar.classList.toggle('sidebar-open');
        backdrop.classList.toggle('active');
    }
</script>
