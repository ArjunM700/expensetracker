<!-- Left Sidebar Navigation Component -->
<style>
    :root {
        --sidebar-bg: #0b1f2e;
        --sidebar-border: rgba(77, 141, 186, 0.22);
        --brand-dark: #086288;
        --brand-mid: #4D8DBA;
        --brand-ice: #97D7FF;
        --brand-cream: #FFEFC4;
        --sidebar-text: #f4f9fc;
        --sidebar-muted: #8ca5b5;
        --sidebar-hover: rgba(77, 141, 186, 0.14);
        --sidebar-width: 260px;
    }

    /* Fixed Left Sidebar */
    .app-sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: var(--sidebar-width);
        background-color: var(--sidebar-bg);
        border-right: 1px solid var(--sidebar-border);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 24px 18px;
        z-index: 1000;
        box-sizing: border-box;
    }

    /* Brand Logo */
    .sidebar-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
        color: #ffffff;
        font-size: 1.15rem;
        font-weight: 800;
        letter-spacing: -0.4px;
        padding: 6px 10px 22px;
        border-bottom: 1px solid var(--sidebar-border);
    }

    .sidebar-brand-icon {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--brand-dark), var(--brand-mid));
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--brand-cream);
        flex-shrink: 0;
    }

    .sidebar-brand span {
        color: var(--brand-ice);
    }

    /* Navigation Sections */
    .sidebar-body {
        flex: 1;
        overflow-y: auto;
        padding-top: 20px;
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .sidebar-group-title {
        font-size: 0.72rem;
        text-transform: uppercase;
        font-weight: 700;
        letter-spacing: 0.8px;
        color: var(--sidebar-muted);
        padding: 0 12px;
        margin-bottom: 8px;
    }

    .sidebar-menu {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .sidebar-link {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 14px;
        border-radius: 10px;
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--sidebar-muted);
        transition: all 0.2s ease;
    }

    .sidebar-link svg {
        flex-shrink: 0;
        stroke: currentColor;
    }

    .sidebar-link:hover {
        color: var(--sidebar-text);
        background: var(--sidebar-hover);
        transform: translateX(3px);
    }

    /* Highlighted Action Buttons (Add Expense / Add Income) */
    .sidebar-btn-primary {
        background: var(--brand-cream);
        color: #06151f !important;
        font-weight: 700;
        box-shadow: 0 4px 14px rgba(255, 239, 196, 0.12);
    }

    .sidebar-btn-primary svg {
        stroke: #06151f !important;
    }

    .sidebar-btn-primary:hover {
        background: #ffffff !important;
        color: #06151f !important;
        transform: translateY(-2px);
    }

    .sidebar-btn-accent {
        background: rgba(151, 215, 255, 0.12);
        color: var(--brand-ice) !important;
        border: 1px solid rgba(151, 215, 255, 0.25);
    }

    .sidebar-btn-accent:hover {
        background: rgba(151, 215, 255, 0.22);
        color: #ffffff !important;
    }

    /* Bottom User & Logout Controls */
    .sidebar-footer {
        padding-top: 18px;
        border-top: 1px solid var(--sidebar-border);
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .sidebar-logout {
        color: #f87171 !important;
    }

    .sidebar-logout:hover {
        background: rgba(239, 68, 68, 0.12) !important;
        color: #fca5a5 !important;
    }

    /* Mobile Responsive Header Toggle */
    .mobile-header-bar {
        display: none;
    }

    @media (max-width: 820px) {
        .app-sidebar {
            transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.45);
        }

        .app-sidebar.sidebar-open {
            transform: translateX(0);
        }

        .sidebar-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(2px);
            z-index: 999;
        }

        .sidebar-backdrop.active {
            display: block;
        }

        .mobile-header-bar {
            position: sticky;
            top: 0;
            z-index: 990;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--sidebar-bg);
            border-bottom: 1px solid var(--sidebar-border);
            padding: 12px 18px;
        }

        .mobile-brand {
            font-size: 1.1rem;
            font-weight: 800;
            color: #ffffff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .mobile-menu-btn {
            background: rgba(77, 141, 186, 0.15);
            border: 1px solid var(--sidebar-border);
            color: var(--brand-ice);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
        }
    }
</style>
